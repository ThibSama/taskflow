name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_MIN: 75

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Check coverage threshold
        run: |
          LINES=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
          FUNCTIONS=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
          BRANCHES=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)

          {
            echo "### API coverage (Node ${{ matrix.node }})"
            echo ""
            echo "| Metric | Coverage |"
            echo "|---|---:|"
            echo "| Lines | ${LINES}% |"
            echo "| Statements | ${STATEMENTS}% |"
            echo "| Functions | ${FUNCTIONS}% |"
            echo "| Branches | ${BRANCHES}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          if awk -v pct="$LINES" -v min="$COVERAGE_MIN" 'BEGIN { exit !(pct < min) }'; then
            echo "::error title=Coverage below threshold::Lines ${LINES}% < ${COVERAGE_MIN}%"
            exit 1
          fi

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload front artifact
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist/
          retention-days: 7
          if-no-files-found: error
