name: taskflow-monitoring

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.external-url=http://localhost:${PROMETHEUS_PORT:-9090}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/tests:/etc/prometheus/tests:ro
      - prometheus-data:/prometheus
    networks: [monitoring, taskflow]
    restart: unless-stopped

  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring, taskflow]
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:${ALERTMANAGER_PORT:-9093}
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring]
    restart: unless-stopped

  mailpit:
    image: docker.io/axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.0.10
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskflow-red.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring: {}

  taskflow:
    name: ${TASKFLOW_NETWORK:-taskflow-prod}
    external: true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
