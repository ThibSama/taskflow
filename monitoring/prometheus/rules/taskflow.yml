groups:
  - name: taskflow.recording
    rules:
      - record: taskflow:http_requests:rate5m
        expr: sum by (env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      - record: taskflow:http_errors:ratio5m
        expr: |
          sum by (env) (rate(http_requests_total{job="taskflow-api", status_code=~"5.."}[5m]))
          /
          sum by (env) (rate(http_requests_total{job="taskflow-api"}[5m]))

      - record: taskflow:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (le, env) (rate(http_request_duration_seconds_bucket{job="taskflow-api"}[5m])))

  - name: taskflow.alerts
    rules:
      - alert: TaskFlowApiDown
        expr: probe_success{job="blackbox-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow {{ $labels.env }} : /health ne répond plus"
          description: "La sonde sur {{ $labels.instance }} échoue depuis plus d'une minute (code HTTP, corps ou délai)."
          runbook_url: "docs/INCIDENTS.md#méthode-de-diagnostic"

      - alert: TaskFlowMetricsDown
        expr: up{job="taskflow-api"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TaskFlow {{ $labels.env }} : métriques de l'API illisibles"
          description: "Prometheus ne peut plus collecter {{ $labels.instance }} depuis plus d'une minute."
          runbook_url: "docs/INCIDENTS.md#méthode-de-diagnostic"

      - alert: TaskFlowHighErrorRate
        expr: taskflow:http_errors:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskFlow {{ $labels.env }} : taux d'erreur 5xx élevé"
          description: "{{ $value | humanizePercentage }} des requêtes échouent depuis 5 minutes (seuil : 5 %)."
          runbook_url: "docs/INCIDENTS.md#méthode-de-diagnostic"

      - alert: TaskFlowHighLatency
        expr: taskflow:http_request_duration_seconds:p95_5m > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskFlow {{ $labels.env }} : latence p95 dégradée"
          description: "p95 = {{ $value | humanizeDuration }} depuis 5 minutes (objectif : 300 ms)."
          runbook_url: "docs/INCIDENTS.md#méthode-de-diagnostic"

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog : la chaîne d'alerte fonctionne"
          description: "Cette alerte est toujours active. Son absence signifie que Prometheus ou Alertmanager est en panne."
